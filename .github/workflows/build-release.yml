name: Build Narsaq-Go Binaries

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build Cross-Platform Go Binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"

      - name: Build for Windows (amd64)
        run: |
          GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o narsaq-go-windows-amd64.exe main.go

      - name: Build for Linux (amd64)
        run: |
          GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o narsaq-go-linux-amd64 main.go

      - name: Build for Android / Linux ARM64 (Termux & ARM)
        run: |
          GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o narsaq-go-linux-arm64 main.go

      - name: Build for macOS Apple Silicon (arm64)
        run: |
          GOOS=darwin GOARCH=arm64 go build -ldflags="-s -w" -o narsaq-go-darwin-arm64 main.go

      - name: Build for macOS Intel (amd64)
        run: |
          GOOS=darwin GOARCH=amd64 go build -ldflags="-s -w" -o narsaq-go-darwin-amd64 main.go

      - name: Generate SHA256 checksums
        run: |
          sha256sum narsaq-go-* > SHA256SUMS.txt

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: narsaq-go-binaries
          path: |
            narsaq-go-*
            SHA256SUMS.txt

      - name: Create GitHub Release on Tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            narsaq-go-*
            SHA256SUMS.txt
          generate_release_notes: true
