name: Build Desktop Release

# ساخت ریلیز دسکتاپ به صورت کامل روی GitHub — بدون نیاز به هیچ کامپیوتر محلی.
#
# دو راه اجرا:
#   1. دستی:  در تب Actions گزینه «Run workflow» را بزنید.
#   2. خودکار: یک tag با پیشوند v بزنید (مثلا git tag v1.0.0 && git push --tags)
#              که علاوه بر آپلود آرتیفکت، یک GitHub Release هم با فایل‌ها می‌سازد.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools (PyInstaller + Pillow for the icon)
        run: pip install pyinstaller==6.20.0 pillow

      - name: Install Inno Setup (for the Windows installer)
        run: choco install innosetup -y --no-progress

      - name: Build release (exe + portable zip + installer + checksums)
        run: python build_release.py

      - name: Show artifacts
        shell: bash
        run: ls -la releases/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: narsaq-desktop-release
          path: |
            releases/*.exe
            releases/*.zip
            releases/SHA256SUMS.txt
          if-no-files-found: error

      - name: Create GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            releases/*.exe
            releases/*.zip
            releases/SHA256SUMS.txt
          generate_release_notes: true
          draft: false
