name: Go CI

on:
  pull_request:
    paths:
      - "go/**"
      - ".github/workflows/go-ci.yml"
  push:
    branches:
      - main
    paths:
      - "go/**"
      - ".github/workflows/go-ci.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.mod
      - name: Test
        run: go test ./...
